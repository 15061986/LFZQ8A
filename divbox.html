<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beispiel: Div-Boxen</title>
    <style>
        .container {
            width: 100%;
            background-color: #f0f0f0;
            padding: 20px;
        }

        .box {
            width: 30%;
            padding: 10px;
            margin: 10px;
            background-color: lightblue;
            float: left;
            /* Positioniert die Boxen nebeneinander */
        }

        .box1 {
            width: 30%;
            padding: 10px;
            margin: 10px;
            background-color: rgb(209, 173, 230);
            float: left;
            /* Positioniert die Boxen nebeneinander */
        }

        .clearfix {
            clear: both;
            /* Hebt das Floaten auf */
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">
            <div class="box1">Box 1b</div>
        </div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="clearfix"></div> <!-- Stellt sicher, 
                                         dass der Container nach den Boxen 
                                         korrekt angezeigt wird -->
    </div>

</body>

</html>
